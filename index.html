<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회독 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
  /* ===== 기본 스타일 ===== */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #f4f5f7;
    color: #222;
  }
  header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .backup { display: flex; gap: 6px; }
  .backup button { border: 1px solid #ddd; background: #fff; color: #666; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .backup button:hover { background: #f4f5f7; }
  header h1 { margin: 0; font-size: 20px; }
  #edit-name { border: none; background: none; cursor: pointer; font-size: 16px; opacity: .6; }
  #edit-name:hover { opacity: 1; }
  main { display: flex; gap: 20px; padding: 20px 24px; align-items: flex-start; flex-wrap: wrap; }

  /* ===== 달력 ===== */
  .calendar { flex: 1 1 840px; background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .nav h2 { margin: 0; font-size: 18px; min-width: 130px; text-align: center; }
  .nav button { border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .nav button:hover { background: #f0f0f0; }
  .nav button:disabled { color: #ccc; cursor: not-allowed; background: #fff; }

  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .weekdays div { text-align: center; font-size: 13px; padding: 4px 0; color: #666; }
  .weekdays div:first-child { color: #d93b3b; }
  .weekdays div:last-child { color: #2f6fd6; }

  .grid { border-top: 1px solid #e3e3e3; border-left: 1px solid #e3e3e3; }
  .cell {
    min-height: 112px;
    border-right: 1px solid #e3e3e3;
    border-bottom: 1px solid #e3e3e3;
    padding: 4px 0 6px;
    cursor: pointer;
  }
  .cell:hover { background: #fafbff; }
  .cell.other { background: #fafafa; }
  .cell.other .num .d { color: #bbb; }
  /* 날짜 + 회독 숫자: 날짜 칸과 과목별 숫자 칸의 위치가 항상 고정 */
  .num { display: flex; align-items: center; font-size: 13px; padding: 0 2px 0 4px; margin-bottom: 2px; }
  .num .d { width: 22px; text-align: center; border-radius: 10px; }
  .num .s {
    position: relative; width: 19px; height: 26px; line-height: 26px; text-align: center; border-radius: 8px;
    font-family: "Nunito", "Varela Round", "Malgun Gothic", sans-serif;  /* 둥근 글씨체 (인터넷 연결 시 Nunito) */
    font-size: 16px; font-weight: 800; cursor: default;
  }
  .num .s.off { font-size: 13px; opacity: .55; }
  /* 휴일 지정: 새 회독 추가 아래의 작고 눈에 덜 띄는 영역 */
  .off-section { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed #e3e3e3; }
  .off-label { font-size: 12px; color: #999; white-space: nowrap; }
  .off-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .off-chips button {
    padding: 2px 8px; font-size: 11px; border-radius: 10px; cursor: pointer;
    background: #fff; border: 1px solid #ddd; color: #888; font-weight: normal;
  }
  .off-chips button:hover { border-color: var(--c); color: var(--c); }
  .off-chips button.selected { background: var(--c); border-color: var(--c); color: #fff; }
  .num .s[data-tip]:hover { background: #eef0f5; z-index: 20; }
  /* 마우스를 올리면 바로 뜨는 설명 말풍선 */
  .num .s[data-tip]:hover::after {
    content: attr(data-tip); position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    margin-top: 4px; padding: 6px 10px; background: #222; color: #fff; border-radius: 8px;
    font-family: "Malgun Gothic", sans-serif; font-size: 12px; font-weight: normal; line-height: 1.5;
    white-space: pre; text-align: left; pointer-events: none;
  }
  .cell.sun .num .d { color: #d93b3b; }
  .cell.sat .num .d { color: #2f6fd6; }
  .cell.today .num .d { background: #222; color: #fff; }
  .cell.other .num .s { opacity: .45; }

  .hint { font-size: 12px; color: #888; margin: 10px 0 0; }

  /* ===== 회독 현황 ===== */
  .side { flex: 0 1 260px; display: flex; flex-direction: column; gap: 16px; }
  .summary, .monthplan { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .monthplan h3 { margin: 0 0 10px; font-size: 16px; }
  .mp-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px dashed #eee; }
  .mp-row input[type=checkbox] { flex-shrink: 0; width: 16px; height: 16px; cursor: pointer; }
  .mp-row input[type=text] { flex: 1; min-width: 0; border: none; outline: none; font-size: 14px; padding: 4px 2px; background: transparent; font-family: inherit; }
  .mp-row input[type=text]:focus { background: #f6f7fb; border-radius: 4px; }
  .mp-row.done input[type=text] { text-decoration: line-through; color: #aaa; }
  .mp-hint { font-size: 11px; color: #999; margin: 8px 0 0; }
  .summary h3 { margin: 0 0 12px; font-size: 16px; }
  .summary ul { list-style: none; margin: 0; padding: 0; }
  .summary li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  .summary li:last-child { border-bottom: none; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .summary .subj { font-weight: bold; width: 36px; }
  .summary .none { color: #aaa; }

  /* ===== 추가 창 (모달) ===== */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; }
  .dialog { background: #fff; border-radius: 12px; padding: 20px 24px; width: 380px; max-width: 92vw; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
  .hidden { display: none !important; }

  /* 탭 */
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid #e3e3e3; }
  .tabs button { border: none; background: none; padding: 8px 12px; cursor: pointer; font-size: 14px; color: #888; border-bottom: 2px solid transparent; }
  .tabs button.active { color: #222; font-weight: bold; border-bottom-color: #222; }

  /* 계획(메모) */
  .note-list { list-style: none; margin: 0 0 12px; padding: 0; max-height: 220px; overflow-y: auto; }
  .note-list li { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
  .note-list .text { flex: 1; word-break: break-all; }
  .note-list li.done .text { text-decoration: line-through; color: #aaa; }
  .note-list .empty { color: #aaa; justify-content: center; }
  .note-list .icon { border: none; background: none; cursor: pointer; opacity: .6; padding: 2px; }
  .note-list .icon:hover { opacity: 1; }
  .note-form { display: flex; gap: 6px; margin-bottom: 14px; }
  .note-form select { padding: 6px 4px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  .note-form input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .primary-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #222; background: #222; color: #fff; cursor: pointer; }

  /* 달력 칸 안의 계획 한 줄 */
  .note { font-size: 12px; line-height: 18px; margin: 0 4px 2px; padding-left: 4px; border-left: 3px solid var(--c, #999); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #111; }
  .note.done { text-decoration: line-through; color: #aaa; }
  .note-more { font-size: 11px; color: #888; margin: 0 4px; padding-left: 7px; }

  /* 날짜 창의 회독 목록 */
  .sub { margin: 0 0 8px; font-size: 13px; color: #666; }
  .round-list { list-style: none; margin: 0 0 14px; padding: 0; }
  .round-list li { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; flex-wrap: wrap; }
  .round-list .info { flex: 1 1 100%; }
  .round-list .empty { color: #aaa; justify-content: center; }
  .round-list button { padding: 3px 10px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-size: 12px; }
  .round-list .del { color: #d93b3b; }
  .edit-box { flex: 1 1 100%; background: #f6f7fb; border-radius: 8px; padding: 8px 10px; font-size: 12px; }
  .edit-box input { padding: 4px 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; font-family: inherit; }
  .edit-box .e-days { width: 56px; }
  .edit-box .e-preview { margin: 8px 0; min-height: 18px; }
  .edit-box .e-actions { display: flex; justify-content: flex-end; gap: 6px; }
  .edit-box .e-save { background: #222; border-color: #222; color: #fff; }
  .edit-box .e-save:disabled { background: #aaa; border-color: #aaa; cursor: not-allowed; }
  .new-round { border-top: 1px solid #e3e3e3; padding-top: 12px; }
  .dialog h3 { margin: 0 0 16px; font-size: 17px; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  .subjects { display: flex; gap: 8px; }
  .subjects button {
    flex: 1; padding: 8px 0; font-size: 14px; border-radius: 6px; cursor: pointer;
    background: #fff; border: 2px solid var(--c); color: var(--c); font-weight: bold;
  }
  .subjects button.selected { background: var(--c); color: #fff; }
  #days { width: 70px; padding: 6px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
  #preview { min-height: 20px; font-size: 14px; color: #333; margin: 0 0 16px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .actions button { padding: 7px 16px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-size: 14px; }
  .actions .primary { background: #222; color: #fff; border-color: #222; }
  .actions .primary:disabled { background: #aaa; border-color: #aaa; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>📚 <span id="site-title"></span> <button id="edit-name" title="이름 바꾸기">✏️</button></h1>
  <div class="backup">
    <button id="export-btn" title="모든 데이터를 파일로 저장">💾 백업 저장</button>
    <button id="import-btn" title="저장해 둔 백업 파일 불러오기">📂 불러오기</button>
    <input type="file" id="import-file" accept=".json,application/json" class="hidden">
  </div>
</header>

<main>
  <section class="calendar">
    <div class="nav">
      <button id="prev">◀</button>
      <h2 id="title"></h2>
      <button id="next">▶</button>
      <button id="today">오늘</button>
    </div>
    <div class="weekdays">
      <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div id="grid" class="grid"></div>
    <p class="hint">날짜를 클릭하면 계획과 회독을 관리할 수 있어요. 날짜 옆 색 숫자는 회독 며칠째인지예요 (민소·특허·상표 순, 마우스를 올려 보세요).</p>
  </section>

  <aside class="side">
    <div class="summary">
      <h3>회독 현황</h3>
      <ul id="summary"></ul>
    </div>
    <div class="monthplan">
      <h3 id="mp-title"></h3>
      <div id="mp-list"></div>
      <p class="mp-hint">Enter: 다음 줄</p>
    </div>
  </aside>
</main>

<!-- 회독 추가 창 -->
<div id="modal" class="modal hidden">
  <div class="dialog">
    <h3 id="modal-title"></h3>
    <div class="tabs">
      <button id="tab-round" data-tab="round">📚 회독</button>
      <button id="tab-notes" data-tab="notes">📝 계획</button>
    </div>

    <!-- 📝 계획 탭 -->
    <div id="panel-notes">
      <ul id="note-list" class="note-list"></ul>
      <div class="note-form">
        <select id="note-subject"></select>
        <input type="text" id="note-text" placeholder="새 계획 입력 후 Enter" maxlength="60">
        <button id="note-add" class="primary-btn">추가</button>
      </div>
      <div class="actions"><button id="close-notes">닫기</button></div>
    </div>

    <!-- 📚 회독 탭 -->
    <div id="panel-round">
      <h4 class="sub">이 날의 회독</h4>
      <ul id="round-list" class="round-list"></ul>
      <div class="new-round">
      <h4 class="sub">새 회독 추가</h4>
      <div class="field">
        <label>과목</label>
        <div id="subject-buttons" class="subjects"></div>
      </div>
      <div class="field">
        <label for="days">회독 일수</label>
        <input type="number" id="days" min="1" value="10"> 일
      </div>
      <p id="preview"></p>
      <div class="actions">
        <button id="cancel">취소</button>
        <button id="add" class="primary">추가</button>
      </div>
      </div>
      <div class="off-section">
        <span class="off-label">휴일 지정</span>
        <div id="off-chips" class="off-chips"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== 설정: 과목과 색 =====
const SUBJECTS = [
  { name: '민소', color: '#2e9e4f' },  // 초록
  { name: '특허', color: '#d93b3b' },  // 빨강
  { name: '상표', color: '#2f6fd6' },  // 파랑
  // 4번째 과목(보라)은 나중에 여기 한 줄 추가: { name: '○○', color: '#8a4fd6' },
];
const SLOT_COUNT = Math.max(4, SUBJECTS.length);  // 날짜 옆 회독 숫자 자리 수 (4자리 미리 확보)
const MAX_NOTES_SHOWN = 4;                        // 달력 칸에 보이는 계획 개수
const STORAGE_KEY = 'exam-calendar-rounds';
const NOTES_KEY = 'exam-calendar-notes';
const MONTH_PLAN_KEY = 'exam-calendar-month-plans';
const OFF_KEY = 'exam-calendar-off-days';

// ===== 설정: 달력 범위 (월은 1~12) =====
const MIN_MONTH = { year: 2026, month: 11 };
const MAX_MONTH = { year: 2027, month: 7 };
const MIN_DATE = MIN_MONTH.year + '-' + String(MIN_MONTH.month).padStart(2, '0') + '-01';
const MAX_DATE = toKey(new Date(MAX_MONTH.year, MAX_MONTH.month, 0));  // 7월 마지막 날
function monthIndex(y, m) { return y * 12 + m; }  // m은 0~11

// ===== 상태 =====
// rounds: [{ id, subject, start: 'YYYY-MM-DD', end: 'YYYY-MM-DD', days }]
let rounds = load();
// notes: [{ id, date: 'YYYY-MM-DD', text, done, subject: '민소' | ... | null }]
let notes = loadNotes();
// offDays: { '민소': { 'YYYY-MM-DD': true, ... }, ... }  과목별 쉬는 날
let offDays = loadOff();
let monthPlans = loadMonthPlans();   // 월간 계획 (아래 월간 계획 부분 참고)
let activeTab = 'notes';            // 날짜 창의 현재 탭: 'notes' | 'round'
let viewYear, viewMonth;             // 지금 보고 있는 달 (month는 0~11)
let selectedDate = null;             // 추가 창에서 선택한 시작일
let selectedSubject = null;          // 추가 창에서 선택한 과목
let editingRoundId = null;           // 회독 탭에서 수정 칸이 펼쳐진 회독

// ===== 저장/불러오기 (브라우저 localStorage) =====
function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch (e) { return []; }
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(rounds));
}
function loadOff() {
  try { return JSON.parse(localStorage.getItem(OFF_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveOff() {
  localStorage.setItem(OFF_KEY, JSON.stringify(offDays));
}
function loadNotes() {
  try { return JSON.parse(localStorage.getItem(NOTES_KEY)) || []; }
  catch (e) { return []; }
}
function loadMonthPlans() {
  try { return JSON.parse(localStorage.getItem(MONTH_PLAN_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveNotes() {
  localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
}

// ===== 제목 개인화: "OOO의 캘린더" =====
const NAME_KEY = 'exam-calendar-owner';

function loadName() {
  try { return localStorage.getItem(NAME_KEY) || ''; }
  catch (e) { return ''; }
}

function renderTitle() {
  const name = loadName();
  const title = name ? name + '의 캘린더' : '내 캘린더';
  document.getElementById('site-title').textContent = title;
  document.title = title;
}

function editName() {
  const input = prompt('이름을 입력하세요 (예: 민수 → "민수의 캘린더")\n비워 두면 "내 캘린더"로 돌아가요.', loadName());
  if (input === null) return;   // 취소
  try { localStorage.setItem(NAME_KEY, input.trim()); } catch (e) {}
  renderTitle();
}

// ===== 날짜 도구: 날짜는 'YYYY-MM-DD' 문자열로 다룸 =====
function toKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fromKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function addDays(key, n) {
  const d = fromKey(key);
  d.setDate(d.getDate() + n);
  return toKey(d);
}
function diffDays(a, b) {   // a - b (일)
  return Math.round((fromKey(a) - fromKey(b)) / 86400000);
}
// 그 과목이 그날 쉬는 날인지
function isOff(subject, key) {
  return !!(offDays[subject] && offDays[subject][key]);
}
// key 이후(포함) 처음 오는 공부하는 날
function nextStudyDay(subject, key) {
  while (isOff(subject, key)) key = addDays(key, 1);
  return key;
}
// 시작일을 1일째로 세고, 그 과목의 휴일은 건너뜀: 11/3 시작 + 10일, 11/6 휴일 → 11/13 종료
function calcEnd(start, days, subject) {
  let d = start, count = 0;
  while (true) {
    if (!isOff(subject, d)) count++;
    if (count === days) return d;
    d = addDays(d, 1);
  }
}
function shortDate(key) {
  const d = fromKey(key);
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function longDate(key) {
  const d = fromKey(key);
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
}
function colorOf(subject) {
  return SUBJECTS.find(s => s.name === subject).color;
}

// ===== 계산 =====
// 과목별로 시작일 순서대로 1회독, 2회독... 번호 매기기
function roundNumbers() {
  const nums = {};
  for (const s of SUBJECTS) {
    rounds
      .filter(r => r.subject === s.name)
      .sort((a, b) => a.start.localeCompare(b.start) || a.id - b.id)
      .forEach((r, i) => { nums[r.id] = i + 1; });
  }
  return nums;
}

// key 날짜가 회독 r의 며칠째인지 (공부한 날만 센 일차, 시작일 = 1일차)
function dayOfRound(r, key) {
  let n = 0;
  for (let d = r.start; d <= key; d = addDays(d, 1)) {
    if (!isOff(r.subject, d)) n++;
  }
  return n;
}

// ===== 휴일 변경 → 회독 종료일 재계산 + 뒤 회독 자동 밀기 =====
// 과목별로 시작일 순서대로 보면서, 앞 회독이 늘거나 줄면
// 뒤 회독의 시작일을 앞 회독과의 간격(일)을 유지한 채 같이 옮긴다.
function reflowRounds() {
  for (const s of SUBJECTS) {
    const list = rounds
      .filter(r => r.subject === s.name)
      .sort((a, b) => a.start.localeCompare(b.start) || a.id - b.id);
    let prev = null, prevOldEnd = null;
    for (const r of list) {
      const oldStart = r.start, oldEnd = r.end;
      if (prev && oldStart > prevOldEnd) {
        r.start = addDays(prev.end, diffDays(oldStart, prevOldEnd));
      }
      r.start = nextStudyDay(r.subject, r.start);
      r.end = calcEnd(r.start, r.days, r.subject);
      prev = r;
      prevOldEnd = oldEnd;
    }
  }
}

// mutate()로 휴일을 바꾼 뒤 재계산. 2027년 7월을 넘으면 되돌리고 false
function applyOffChange(mutate) {
  const backupRounds = JSON.stringify(rounds);
  const backupOff = JSON.stringify(offDays);
  mutate();
  reflowRounds();
  if (rounds.some(r => r.end > MAX_DATE)) {
    rounds = JSON.parse(backupRounds);
    offDays = JSON.parse(backupOff);
    alert('이 휴일을 넣으면 회독이 ' + MAX_MONTH.year + '년 ' + MAX_MONTH.month + '월을 넘어가서 적용할 수 없어요.');
    return false;
  }
  return true;
}

function toggleOff(subject) {
  const key = selectedDate;
  const ok = applyOffChange(() => {
    if (!offDays[subject]) offDays[subject] = {};
    if (offDays[subject][key]) delete offDays[subject][key];
    else offDays[subject][key] = true;
  });
  if (!ok) return;
  save();
  saveOff();
  render();
  renderOffChips();
  renderRoundList();
  updatePreview();
}

// ===== 화면 그리기 =====
function render() {
  renderCalendar();
  renderSummary();
  renderMonthPlan();
}

// ===== 월간 계획: 보고 있는 달마다 한 줄씩 적는 체크 목록 =====
// monthPlans: { 'YYYY-MM': [{ text, done }, ...] }
function monthKey() {
  return viewYear + '-' + String(viewMonth + 1).padStart(2, '0');
}

function saveMonthPlans() {
  const out = {};
  for (const k in monthPlans) {
    const items = monthPlans[k].filter(it => it.text.trim());   // 빈 줄은 저장하지 않음
    if (items.length) out[k] = items;
  }
  try { localStorage.setItem(MONTH_PLAN_KEY, JSON.stringify(out)); } catch (e) {}
}

function renderMonthPlan() {
  document.getElementById('mp-title').textContent = (viewMonth + 1) + '월 계획';
  const key = monthKey();
  if (!monthPlans[key] || monthPlans[key].length === 0) monthPlans[key] = [{ text: '', done: false }];
  const items = monthPlans[key];
  const box = document.getElementById('mp-list');
  box.innerHTML = '';

  items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'mp-row' + (it.done ? ' done' : '');

    const check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = it.done;
    check.addEventListener('change', () => {
      it.done = check.checked;
      row.classList.toggle('done', it.done);
      saveMonthPlans();
    });

    const text = document.createElement('input');
    text.type = 'text';
    text.value = it.text;
    text.maxLength = 80;
    text.addEventListener('input', () => { it.text = text.value; saveMonthPlans(); });
    text.addEventListener('keydown', (e) => {
      if (e.isComposing) return;   // 한글 입력 중에는 무시
      if (e.key === 'Enter') {
        items.splice(i + 1, 0, { text: '', done: false });
        renderMonthPlan();
        focusMonthRow(i + 1);
      } else if (e.key === 'Backspace' && text.value === '' && items.length > 1) {
        e.preventDefault();
        items.splice(i, 1);
        saveMonthPlans();
        renderMonthPlan();
        focusMonthRow(Math.max(0, i - 1));
      }
    });

    row.appendChild(check);
    row.appendChild(text);
    box.appendChild(row);
  });
}

function focusMonthRow(i) {
  const inputs = document.querySelectorAll('#mp-list input[type=text]');
  if (inputs[i]) inputs[i].focus();
}

function renderCalendar() {
  document.getElementById('title').textContent = viewYear + '년 ' + (viewMonth + 1) + '월';
  const cur = monthIndex(viewYear, viewMonth);
  document.getElementById('prev').disabled = cur <= monthIndex(MIN_MONTH.year, MIN_MONTH.month - 1);
  document.getElementById('next').disabled = cur >= monthIndex(MAX_MONTH.year, MAX_MONTH.month - 1);

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const nums = roundNumbers();
  const todayKey = toKey(new Date());

  // 달력 첫 칸 = 이번 달 1일이 속한 주의 일요일
  const first = new Date(viewYear, viewMonth, 1);
  const cursor = new Date(viewYear, viewMonth, 1 - first.getDay());

  for (let i = 0; i < 42; i++) {   // 6주 x 7일
    const key = toKey(cursor);
    const dow = cursor.getDay();

    const cell = document.createElement('div');
    cell.className = 'cell';
    if (cursor.getMonth() !== viewMonth) cell.classList.add('other');
    if (dow === 0) cell.classList.add('sun');
    if (dow === 6) cell.classList.add('sat');
    if (key === todayKey) cell.classList.add('today');
    // 날짜 옆 회독 숫자: 과목마다 자리가 고정 (민소, 특허, 상표, 4번째 예비 자리)
    const todays = rounds.filter(r => r.start <= key && key <= r.end);
    let slots = '';
    for (let s = 0; s < SLOT_COUNT; s++) {
      const subj = SUBJECTS[s];
      const rs = subj ? todays.filter(r => r.subject === subj.name) : [];
      if (rs.length === 0) { slots += '<span class="s"></span>'; continue; }
      if (isOff(subj.name, key)) {   // 쉬는 날: 연한 "휴"
        const tip = rs.map(r => r.subject + ' ' + nums[r.id] + '회독 · 휴일 (공부 안 하는 날)').join('\n');
        slots += '<span class="s off" style="color:' + subj.color + '" data-tip="' + tip + '">휴</span>';
        continue;
      }
      const tip = rs.map(r => r.subject + ' ' + nums[r.id] + '회독 · ' + dayOfRound(r, key) + '일차 ('
                              + shortDate(r.start) + '~' + shortDate(r.end) + ')').join('\n');
      slots += '<span class="s" style="color:' + subj.color + '" data-tip="' + tip + '">' + dayOfRound(rs[0], key) + '</span>';
    }
    cell.innerHTML = '<div class="num"><span class="d">' + cursor.getDate() + '</span>' + slots + '</div>';
    if (key >= MIN_DATE && key <= MAX_DATE) {
      cell.addEventListener('click', () => openModal(key));
    } else {
      cell.style.cursor = 'default';   // 범위 밖 날짜는 클릭 불가
    }

    // 그날의 계획: 최대 MAX_NOTES_SHOWN개만 보여주고 나머지는 "+N개 더"
    const dayNotes = notes.filter(n => n.date === key);
    for (const n of dayNotes.slice(0, MAX_NOTES_SHOWN)) {
      const el = document.createElement('div');
      el.className = 'note' + (n.done ? ' done' : '');
      if (n.subject) el.style.setProperty('--c', colorOf(n.subject));
      el.textContent = n.text;
      el.title = n.text;
      cell.appendChild(el);
    }
    if (dayNotes.length > MAX_NOTES_SHOWN) {
      const more = document.createElement('div');
      more.className = 'note-more';
      more.textContent = '+' + (dayNotes.length - MAX_NOTES_SHOWN) + '개 더';
      cell.appendChild(more);
    }

    grid.appendChild(cell);
    cursor.setDate(cursor.getDate() + 1);
  }
}

function renderSummary() {
  const ul = document.getElementById('summary');
  ul.innerHTML = '';
  for (const s of SUBJECTS) {
    const list = rounds.filter(r => r.subject === s.name);
    const li = document.createElement('li');
    let text;
    if (list.length === 0) {
      text = '<span class="none">아직 없음</span>';
    } else {
      const lastEnd = list.map(r => r.end).sort().pop();
      text = '<span>' + shortDate(lastEnd) + '까지 <b>' + list.length + '회독</b> 예정</span>';
    }
    li.innerHTML = '<span class="dot" style="background:' + s.color + '"></span>'
                 + '<span class="subj">' + s.name + '</span>' + text;
    ul.appendChild(li);
  }
}

// ===== 추가 창 =====
// preset: { subject, days } 를 주면 과목과 일수를 미리 채움 (이어서 회독용)
function openModal(dateKey, preset) {
  selectedDate = dateKey;
  editingRoundId = null;
  selectedSubject = preset ? preset.subject : null;
  document.getElementById('days').value = preset ? preset.days : 10;
  document.getElementById('modal-title').textContent = longDate(dateKey);
  document.querySelectorAll('#subject-buttons button').forEach(b => {
    b.classList.toggle('selected', b.textContent === selectedSubject);
  });
  updatePreview();
  document.getElementById('note-text').value = '';
  showTab('round');   // 날짜를 클릭하면 회독 탭이 먼저 열림
  document.getElementById('modal').classList.remove('hidden');
}

// ===== 날짜 창: 탭 전환 =====
function showTab(tab) {
  activeTab = tab;
  document.getElementById('tab-notes').classList.toggle('active', tab === 'notes');
  document.getElementById('tab-round').classList.toggle('active', tab === 'round');
  document.getElementById('panel-notes').classList.toggle('hidden', tab !== 'notes');
  document.getElementById('panel-round').classList.toggle('hidden', tab !== 'round');
  if (tab === 'notes') {
    renderNotesList();
    document.getElementById('note-text').focus();
  } else {
    renderOffChips();
    renderRoundList();
  }
}

// ===== 회독 탭: 이 날 쉬는 과목 버튼 =====
function renderOffChips() {
  const box = document.getElementById('off-chips');
  box.innerHTML = '';
  for (const s of SUBJECTS) {
    const off = isOff(s.name, selectedDate);
    const b = document.createElement('button');
    b.textContent = s.name + (off ? ' 휴' : '');
    b.style.setProperty('--c', s.color);
    b.classList.toggle('selected', off);
    b.addEventListener('click', () => toggleOff(s.name));
    box.appendChild(b);
  }
}

// ===== 회독 탭: 이 날 걸친 회독 목록 (이어서 / 삭제) =====
function renderRoundList() {
  const ul = document.getElementById('round-list');
  ul.innerHTML = '';
  const nums = roundNumbers();
  const list = rounds
    .filter(r => r.start <= selectedDate && selectedDate <= r.end)
    .sort((a, b) => SUBJECTS.findIndex(s => s.name === a.subject) - SUBJECTS.findIndex(s => s.name === b.subject));
  if (list.length === 0) {
    ul.innerHTML = '<li class="empty">이 날은 진행 중인 회독이 없어요</li>';
    return;
  }
  for (const r of list) {
    const label = r.subject + ' ' + nums[r.id] + '회독';
    const li = document.createElement('li');

    const info = document.createElement('span');
    info.className = 'info';
    info.innerHTML = '<span class="dot" style="background:' + colorOf(r.subject) + ';display:inline-block"></span> '
      + '<b>' + label + '</b> · ' + (isOff(r.subject, selectedDate) ? '휴일' : dayOfRound(r, selectedDate) + '일차')
      + ' (' + shortDate(r.start) + '~' + shortDate(r.end) + ')';

    const cont = document.createElement('button');
    cont.textContent = '이어서 다음 회독';
    cont.addEventListener('click', () => continueRound(r));

    const edit = document.createElement('button');
    edit.textContent = '수정';
    edit.addEventListener('click', () => {
      editingRoundId = (editingRoundId === r.id) ? null : r.id;   // 다시 누르면 접기
      renderRoundList();
    });

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '삭제';
    del.addEventListener('click', () => deleteRound(r, label));

    li.appendChild(info);
    li.appendChild(cont);
    li.appendChild(edit);
    li.appendChild(del);
    if (editingRoundId === r.id) li.appendChild(buildEditBox(r));
    ul.appendChild(li);
  }
}

// ===== 회독 수정: 시작일과 일수만 바꾸고 종료일은 자동 계산 =====
function buildEditBox(r) {
  const box = document.createElement('div');
  box.className = 'edit-box';
  box.innerHTML = '<label>시작일 <input type="date" class="e-start"></label> '
    + '<label>일수 <input type="number" class="e-days" min="1"> 일</label>'
    + '<p class="e-preview"></p>'
    + '<div class="e-actions"><button class="e-cancel">취소</button><button class="e-save primary-btn">저장</button></div>';
  const startIn = box.querySelector('.e-start');
  const daysIn = box.querySelector('.e-days');
  const preview = box.querySelector('.e-preview');
  const saveBtn = box.querySelector('.e-save');
  startIn.min = MIN_DATE;
  startIn.max = MAX_DATE;
  startIn.value = r.start;
  daysIn.value = r.days;

  function update() {
    const start = startIn.value;
    const days = parseInt(daysIn.value, 10);
    if (!DATE_RE.test(start) || start < MIN_DATE || start > MAX_DATE || !(days >= 1)) {
      preview.textContent = '시작일(' + MIN_MONTH.year + '년 ' + MIN_MONTH.month + '월~' + MAX_MONTH.year + '년 ' + MAX_MONTH.month + '월)과 일수를 확인하세요.';
      saveBtn.disabled = true;
      return;
    }
    const realStart = nextStudyDay(r.subject, start);
    const end = calcEnd(realStart, days, r.subject);
    preview.innerHTML = (realStart !== start ? shortDate(start) + '은 ' + r.subject + ' 휴일이라 <b>' + shortDate(realStart) + '</b>부터 시작<br>' : '')
      + '→ 종료일: <b>' + longDate(end) + '</b> (뒤 회독은 같이 이동)';
    if (end > MAX_DATE) {
      preview.innerHTML += '<br><span style="color:#d93b3b">⚠ ' + MAX_MONTH.year + '년 ' + MAX_MONTH.month + '월을 넘어요.</span>';
      saveBtn.disabled = true;
      return;
    }
    saveBtn.disabled = false;
  }
  startIn.addEventListener('input', update);
  daysIn.addEventListener('input', update);
  box.querySelector('.e-cancel').addEventListener('click', () => { editingRoundId = null; renderRoundList(); });
  saveBtn.addEventListener('click', () => {
    if (!applyRoundEdit(r.id, startIn.value, parseInt(daysIn.value, 10))) return;
    editingRoundId = null;
    save();
    render();
    renderRoundList();
    updatePreview();
  });
  update();
  return box;
}

// 시작일/일수를 바꾸고 종료일 재계산 + 같은 과목 뒤 회독 이동. 범위를 넘으면 되돌리고 false
function applyRoundEdit(id, start, days) {
  const backup = JSON.stringify(rounds);
  const r = rounds.find(x => x.id === id);
  if (!r) return false;
  r.start = start;
  r.days = days;
  // r.end는 옛 값 그대로 둠: reflowRounds가 뒤 회독이 얼마나 밀릴지 계산할 때 필요
  reflowRounds();
  if (rounds.some(x => x.end > MAX_DATE)) {
    rounds = JSON.parse(backup);
    alert('이렇게 수정하면 회독이 ' + MAX_MONTH.year + '년 ' + MAX_MONTH.month + '월을 넘어가서 적용할 수 없어요.');
    return false;
  }
  return true;
}

// ===== 계획(메모) =====
function renderNotesList() {
  const ul = document.getElementById('note-list');
  ul.innerHTML = '';
  const list = notes.filter(n => n.date === selectedDate);
  if (list.length === 0) {
    ul.innerHTML = '<li class="empty">아직 계획이 없어요</li>';
    return;
  }
  for (const n of list) {
    const li = document.createElement('li');
    if (n.done) li.classList.add('done');

    const check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = n.done;
    check.addEventListener('change', () => { n.done = check.checked; noteChanged(); });

    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = n.text;

    li.appendChild(check);
    if (n.subject) {
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = colorOf(n.subject);
      dot.title = n.subject;
      li.appendChild(dot);
    }
    li.appendChild(text);
    li.appendChild(makeIcon('✏️', '수정', () => {
      const t = prompt('계획 수정', n.text);
      if (t !== null && t.trim()) { n.text = t.trim(); noteChanged(); }
    }));
    li.appendChild(makeIcon('🗑', '삭제', () => {
      notes = notes.filter(x => x.id !== n.id);
      noteChanged();
    }));
    ul.appendChild(li);
  }
}

function makeIcon(label, title, onClick) {
  const b = document.createElement('button');
  b.className = 'icon';
  b.textContent = label;
  b.title = title;
  b.addEventListener('click', onClick);
  return b;
}

function noteChanged() {
  saveNotes();
  renderNotesList();
  renderCalendar();
}

function addNote() {
  const input = document.getElementById('note-text');
  const text = input.value.trim();
  if (!text) return;
  const subject = document.getElementById('note-subject').value || null;
  notes.push({ id: Date.now(), date: selectedDate, text: text, done: false, subject: subject });
  input.value = '';
  noteChanged();
  input.focus();
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
}

function getDays() {
  const n = parseInt(document.getElementById('days').value, 10);
  return n >= 1 ? n : null;
}

function updatePreview() {
  const preview = document.getElementById('preview');
  const addBtn = document.getElementById('add');
  const days = getDays();
  if (!selectedSubject || !days) {
    preview.textContent = !selectedSubject ? '과목을 선택하세요.' : '일수를 1 이상으로 입력하세요.';
    addBtn.disabled = true;
    return;
  }
  // 시작일이 그 과목의 휴일이면 다음 공부하는 날부터 시작
  const start = nextStudyDay(selectedSubject, selectedDate);
  // 새 회독이 몇 번째가 될지 미리 계산
  const n = rounds.filter(r => r.subject === selectedSubject && r.start <= start).length + 1;
  const end = calcEnd(start, days, selectedSubject);
  preview.innerHTML = '';
  if (start !== selectedDate) {
    preview.innerHTML = shortDate(selectedDate) + '은 ' + selectedSubject + ' 휴일이라 <b>' + shortDate(start) + '</b>부터 시작<br>';
  }
  preview.innerHTML += '→ 종료일: <b>' + longDate(end) + '</b> (' + selectedSubject + ' ' + n + '회독)';
  if (end > MAX_DATE) {
    preview.innerHTML += '<br><span style="color:#d93b3b">⚠ 종료일이 ' + MAX_MONTH.year + '년 ' + MAX_MONTH.month + '월을 넘어요. 일수를 줄여 주세요.</span>';
    addBtn.disabled = true;
    return;
  }
  addBtn.disabled = false;
}

function addRound() {
  const days = getDays();
  if (!selectedSubject || !days) return;
  const start = nextStudyDay(selectedSubject, selectedDate);
  const end = calcEnd(start, days, selectedSubject);
  if (end > MAX_DATE) return;
  rounds.push({
    id: Date.now(),
    subject: selectedSubject,
    start: start,
    end: end,
    days: days,   // 공부하는 날 기준 일수
  });
  save();
  closeModal();
  render();
}

function deleteRound(r, label) {
  if (!confirm(label + ' (' + shortDate(r.start) + '~' + shortDate(r.end) + ')을 삭제할까요?')) return;
  rounds = rounds.filter(x => x.id !== r.id);
  save();
  render();
  renderRoundList();
  updatePreview();
}

// ===== 이어서 다음 회독: 끝난 다음 날로 날짜 창을 다시 열고 과목/일수를 채움 =====
function continueRound(r) {
  const next = nextStudyDay(r.subject, addDays(r.end, 1));   // 끝난 다음 공부하는 날부터
  if (next > MAX_DATE) {
    alert('다음 회독 시작일이 ' + MAX_MONTH.year + '년 ' + MAX_MONTH.month + '월을 넘어서 추가할 수 없어요.');
    return;
  }
  // 이어서 회독이 보이도록 시작일이 있는 달로 이동
  const d = fromKey(next);
  viewYear = d.getFullYear();
  viewMonth = d.getMonth();
  render();
  openModal(next, { subject: r.subject, days: r.days });
}

// ===== 백업: 모든 데이터를 파일 하나로 저장 / 불러오기 =====
const BACKUP_APP = 'exam-calendar';
const BACKUP_VERSION = 1;
const PREV_BACKUP_KEY = 'exam-calendar-before-import';   // 불러오기 직전 데이터 자동 보관
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

function collectBackup() {
  return {
    app: BACKUP_APP,
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    data: { rounds: rounds, notes: notes, monthPlans: monthPlans, offDays: offDays, owner: loadName() },
  };
}

function exportData() {
  const blob = new Blob([JSON.stringify(collectBackup(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'calendar-backup-' + toKey(new Date()) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// 파일 내용을 검사하고 정리 (이상한 항목은 버림). 백업 파일이 아니면 null
function cleanBackup(obj) {
  if (!obj || obj.app !== BACKUP_APP || !obj.data || typeof obj.data !== 'object') return null;
  const d = obj.data;
  const known = name => SUBJECTS.some(s => s.name === name);
  const usedIds = new Set();
  const newId = (id, i) => {
    let v = Number.isFinite(id) ? id : Date.now() + i;
    while (usedIds.has(v)) v++;
    usedIds.add(v);
    return v;
  };

  const cleanRounds = (Array.isArray(d.rounds) ? d.rounds : [])
    .filter(r => r && known(r.subject) && DATE_RE.test(r.start) && DATE_RE.test(r.end) && Number.isInteger(r.days) && r.days >= 1)
    .map((r, i) => ({ id: newId(r.id, i), subject: r.subject, start: r.start, end: r.end, days: r.days }));

  usedIds.clear();
  const cleanNotes = (Array.isArray(d.notes) ? d.notes : [])
    .filter(n => n && DATE_RE.test(n.date) && typeof n.text === 'string' && n.text.trim())
    .map((n, i) => ({ id: newId(n.id, i), date: n.date, text: n.text, done: !!n.done, subject: known(n.subject) ? n.subject : null }));

  const cleanPlans = {};
  if (d.monthPlans && typeof d.monthPlans === 'object') {
    for (const k in d.monthPlans) {
      if (!/^\d{4}-\d{2}$/.test(k) || !Array.isArray(d.monthPlans[k])) continue;
      const items = d.monthPlans[k]
        .filter(it => it && typeof it.text === 'string' && it.text.trim())
        .map(it => ({ text: it.text, done: !!it.done }));
      if (items.length) cleanPlans[k] = items;
    }
  }

  const cleanOff = {};
  if (d.offDays && typeof d.offDays === 'object') {
    for (const s of SUBJECTS) {
      const src = d.offDays[s.name];
      if (!src || typeof src !== 'object') continue;
      for (const key in src) {
        if (DATE_RE.test(key) && src[key]) (cleanOff[s.name] = cleanOff[s.name] || {})[key] = true;
      }
    }
  }

  return {
    rounds: cleanRounds,
    notes: cleanNotes,
    monthPlans: cleanPlans,
    offDays: cleanOff,
    owner: typeof d.owner === 'string' ? d.owner.trim().slice(0, 30) : '',
  };
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let clean = null;
    try { clean = cleanBackup(JSON.parse(reader.result)); } catch (e) {}
    if (!clean) {
      alert('이 파일은 캘린더 백업 파일이 아니에요. 아무것도 바뀌지 않았어요.');
      return;
    }
    const planLines = Object.values(clean.monthPlans).reduce((n, items) => n + items.length, 0);
    const offCount = Object.values(clean.offDays).reduce((n, o) => n + Object.keys(o).length, 0);
    const msg = '이 백업을 불러옵니다.\n\n'
      + '· 회독 ' + clean.rounds.length + '개\n'
      + '· 날짜별 계획 ' + clean.notes.length + '개\n'
      + '· 월간 계획 ' + planLines + '줄\n'
      + '· 휴일 ' + offCount + '일\n\n'
      + '지금 데이터는 모두 이 백업으로 대체됩니다. 계속할까요?';
    if (!confirm(msg)) return;

    // 대체하기 전에 지금 데이터를 브라우저 안에 한 번 보관
    try { localStorage.setItem(PREV_BACKUP_KEY, JSON.stringify(collectBackup())); } catch (e) {}

    rounds = clean.rounds;
    notes = clean.notes;
    monthPlans = clean.monthPlans;
    offDays = clean.offDays;
    save();
    saveNotes();
    saveMonthPlans();
    saveOff();
    try { localStorage.setItem(NAME_KEY, clean.owner); } catch (e) {}
    renderTitle();
    render();
    alert('불러오기를 마쳤어요.');
  };
  reader.readAsText(file);
}

// ===== 시작: 버튼 연결 =====
function init() {
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();

  // 과목 버튼 만들기
  const box = document.getElementById('subject-buttons');
  for (const s of SUBJECTS) {
    const b = document.createElement('button');
    b.textContent = s.name;
    b.style.setProperty('--c', s.color);
    b.addEventListener('click', () => {
      selectedSubject = s.name;
      box.querySelectorAll('button').forEach(x => x.classList.toggle('selected', x === b));
      updatePreview();
    });
    box.appendChild(b);
  }

  document.getElementById('edit-name').addEventListener('click', editName);
  document.getElementById('export-btn').addEventListener('click', exportData);
  const fileInput = document.getElementById('import-file');
  document.getElementById('import-btn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) importData(fileInput.files[0]);
    fileInput.value = '';   // 같은 파일을 다시 골라도 동작하도록
  });
  renderTitle();

  document.getElementById('prev').addEventListener('click', () => moveMonth(-1));
  document.getElementById('next').addEventListener('click', () => moveMonth(1));
  document.getElementById('today').addEventListener('click', () => {
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    render();
  });

  // 계획 탭: 과목 선택(선택사항) + 탭 버튼 + 추가
  const sel = document.getElementById('note-subject');
  sel.innerHTML = SUBJECTS.map(s => '<option value="' + s.name + '">' + s.name + '</option>').join('');
  document.getElementById('tab-notes').addEventListener('click', () => showTab('notes'));
  document.getElementById('tab-round').addEventListener('click', () => showTab('round'));
  document.getElementById('note-add').addEventListener('click', addNote);
  document.getElementById('note-text').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) addNote();   // 한글 입력 중 Enter 중복 방지
  });
  document.getElementById('close-notes').addEventListener('click', closeModal);

  document.getElementById('days').addEventListener('input', updatePreview);
  document.getElementById('add').addEventListener('click', addRound);
  document.getElementById('cancel').addEventListener('click', closeModal);
  // 창 바깥(어두운 부분) 클릭 시 닫기
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') closeModal();
  });
  // Enter = 추가, Esc = 닫기
  document.addEventListener('keydown', (e) => {
    if (document.getElementById('modal').classList.contains('hidden')) return;
    if (e.key === 'Enter' && activeTab === 'round') addRound();
    if (e.key === 'Escape') closeModal();
  });

  render();
}

function moveMonth(delta) {
  let y = viewYear, m = viewMonth + delta;
  if (m < 0) { m = 11; y--; }
  if (m > 11) { m = 0; y++; }
  // 허용 범위 밖이면 이동하지 않음
  if (monthIndex(y, m) < monthIndex(MIN_MONTH.year, MIN_MONTH.month - 1)) return;
  if (monthIndex(y, m) > monthIndex(MAX_MONTH.year, MAX_MONTH.month - 1)) return;
  viewYear = y;
  viewMonth = m;
  render();
}

init();
</script>
